services:
  # 1. RabbitMQ with Management Web UI
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: eda-rabbitmq
    ports:
      - "5672:5672"     # AMQP protocol port
      - "15672:15672"   # RabbitMQ Management Web Dashboard (http://localhost:15672 - user: guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbitmq_prometheus prometheus_path '/metrics'"
    command: sh -c "rabbitmq-plugins enable rabbitmq_prometheus && rabbitmq-server"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Key-Value & Pub/Sub
  redis:
    image: redis:7.2-alpine
    container_name: eda-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. EDA Sales Prototype Application
  eda-app:
    build: .
    container_name: eda-sales-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy

  # 4. Prometheus (Metrics Server)
  prometheus:
    image: prom/prometheus
    container_name: eda-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9090:9090"

  # 5. Grafana (Metrics Dashboard)
  grafana:
    image: grafana/grafana
    container_name: eda-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    depends_on:
      - prometheus

  # 6. Jaeger (Distributed Tracing UI)
  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: eda-jaeger
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
