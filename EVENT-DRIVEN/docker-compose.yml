services:
  # 1. RabbitMQ with Management Web UI
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: eda-rabbitmq
    ports:
      - "5672:5672"     # AMQP protocol port
      - "15672:15672"   # RabbitMQ Management Web Dashboard (http://localhost:15672 - user: guest/guest)
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Redis In-Memory Key-Value & Pub/Sub
  redis:
    image: redis:7.2-alpine
    container_name: eda-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # 3. EDA Sales Prototype Application
  eda-app:
    build: .
    container_name: eda-sales-app
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
