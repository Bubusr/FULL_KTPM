        let currentActiveId = 1;

        function renderSidebar() {
            const navList = document.getElementById('navList');
            navList.innerHTML = '';
            
            let lastTopic = '';
            QUESTIONS_DATA.forEach(q => {
                if (q.topic !== lastTopic) {
                    const groupTitle = document.createElement('div');
                    groupTitle.className = 'topic-group-title';
                    groupTitle.innerText = q.topic;
                    navList.appendChild(groupTitle);
                    lastTopic = q.topic;
                }

                const item = document.createElement('div');
                item.className = `nav-item ${q.id === currentActiveId ? 'active' : ''}`;
                item.id = `nav-item-${q.id}`;
                item.onclick = () => selectQuestion(q.id);
                item.innerHTML = `
                    <div>${q.title}</div>
                    <div class="views-badge">📂 ${q.viewsList.join(' • ')}</div>
                `;
                navList.appendChild(item);
            });
        }

        function selectQuestion(id) {
            currentActiveId = id;
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            const activeEl = document.getElementById(`nav-item-${id}`);
            if (activeEl) activeEl.classList.add('active');

            const q = QUESTIONS_DATA.find(item => item.id === id);
            if (!q) return;

            const mainContent = document.getElementById('mainContent');
            mainContent.innerHTML = `
                <div class="view-header">
                    <h1>${q.title}</h1>
                    <div class="meta-info">
                        <span class="meta-tag">📁 Thư mục: ${q.folder}</span>
                        <span class="meta-tag">🏛️ Góc nhìn: ${q.viewsList.join(', ')}</span>
                    </div>
                </div>
                ${q.diagrams.map((d, index) => `
                    <div class="diagram-card">
                        <h3>📊 ${d.title}</h3>
                        <p class="desc">${d.desc}</p>
                        <div class="mermaid-box">
                            <pre class="mermaid">${d.code}</pre>
                        </div>
                    </div>
                `).join('')}
            `;

            mermaid.run();
        }

        function filterQuestions() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            document.querySelectorAll('.nav-item').forEach(item => {
                const text = item.innerText.toLowerCase();
                item.style.display = text.includes(query) ? 'flex' : 'none';
            });
        }

        // Initialize Mermaid & View
        mermaid.initialize({ startOnLoad: false, theme: 'default', securityLevel: 'loose' });
        renderSidebar();
        selectQuestion(1);
    </script>
