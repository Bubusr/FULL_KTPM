<html lang="vi">

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
  <style>
    :root {
      --sidebar-w: 320px;
      --bg: #f1f5f9;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-dark: #0f172a;
      --ink: #0f172a;
      --muted: #64748b;
      --accent: #0284c7;
      --accent-light: #e0f2fe;
      --shadow: 3px 3px 0px #0f172a;
      --shadow-sm: 2px 2px 0px #0f172a;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--ink);
      display: flex;
      height: 100vh;
      overflow: hidden;
    }

    /* ──────────── SIDEBAR ──────────── */
    .sidebar {
      width: var(--sidebar-w);
      min-width: var(--sidebar-w);
      background: var(--surface);
      border-right: 2px solid var(--border-dark);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .sidebar-header {
      padding: 18px 16px 14px;
      border-bottom: 2px solid var(--border-dark);
      background: #0f172a;
      color: #fff;
    }

    .sidebar-header .logo {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 4px;
    }

    .sidebar-header h1 {
      font-size: 14px;
      font-weight: 800;
      line-height: 1.3;
    }

    .sidebar-header p {
      font-size: 11px;
      color: #94a3b8;
      margin-top: 4px;
    }

    .sidebar-stats {
      display: flex;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: #f8fafc;
    }

    .stat-chip {
      background: var(--accent-light);
      color: var(--accent);
      font-size: 10px;
      font-weight: 700;
      padding: 3px 7px;
      border-radius: 4px;
      border: 1px solid #bae6fd;
    }

    .nav-list {
      flex: 1;
      overflow-y: auto;
      padding: 10px 10px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .nav-group-label {
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--muted);
      padding: 10px 6px 4px;
    }

    .nav-item {
      padding: 9px 11px;
      border-radius: 6px;
      border: 1.5px solid var(--border);
      cursor: pointer;
      transition: all 0.1s ease;
      background: var(--surface);
    }

    .nav-item:hover {
      border-color: var(--accent);
      background: var(--accent-light);
    }

    .nav-item.active {
      background: #0f172a;
      border-color: #0f172a;
      color: #fff;
      box-shadow: var(--shadow-sm);
    }

    .nav-item .nav-num {
      font-size: 10px;
      font-family: 'JetBrains Mono', monospace;
      font-weight: 700;
      margin-bottom: 1px;
      opacity: 0.6;
    }

    .nav-item.active .nav-num { color: #38bdf8; opacity: 1; }

    .nav-item .nav-title {
      font-size: 12px;
      font-weight: 700;
      line-height: 1.3;
    }

    .nav-item .nav-cat {
      font-size: 10px;
      color: var(--muted);
      margin-top: 2px;
    }

    .nav-item.active .nav-cat { color: #94a3b8; }

    .sidebar-footer {
      padding: 12px 16px;
      border-top: 2px solid var(--border-dark);
      background: #f8fafc;
      font-size: 10px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* ──────────── MAIN CONTENT ──────────── */
    .main {
      flex: 1;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      background: var(--bg);
    }

    .topbar {
      background: var(--surface);
      border-bottom: 2px solid var(--border-dark);
      padding: 14px 24px;
      display: flex;
      align-items: flex-start;
      gap: 16px;
    }

    .topbar-icon {
      width: 42px;
      height: 42px;
      background: #0f172a;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
      box-shadow: var(--shadow-sm);
    }

    .topbar-info { flex: 1; }

    .topbar-info h2 {
      font-size: 16px;
      font-weight: 800;
      line-height: 1.2;
    }

    .topbar-info p {
      font-size: 12px;
      color: var(--muted);
      margin-top: 3px;
      line-height: 1.4;
    }

    .badge-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 8px;
    }

    .badge {
      font-size: 10px;
      font-weight: 700;
      padding: 2px 8px;
      border-radius: 4px;
      border: 1.5px solid;
    }

    .badge-blue { background: #dbeafe; color: #1e40af; border-color: #93c5fd; }
    .badge-purple { background: #ede9fe; color: #5b21b6; border-color: #c4b5fd; }
    .badge-green { background: #dcfce7; color: #14532d; border-color: #86efac; }
    .badge-amber { background: #fef3c7; color: #78350f; border-color: #fcd34d; }
    .badge-gray { background: #f1f5f9; color: #475569; border-color: #cbd5e1; }
    .badge-dark { background: #0f172a; color: #f8fafc; border-color: #334155; }

    .controls {
      display: flex;
      gap: 8px;
      align-items: center;
      flex-shrink: 0;
    }

    .btn {
      padding: 7px 14px;
      font-size: 11px;
      font-weight: 700;
      border-radius: 6px;
      border: 2px solid var(--border-dark);
      cursor: pointer;
      background: var(--surface);
      color: var(--ink);
      font-family: 'Inter', sans-serif;
      transition: all 0.1s;
    }

    .btn:hover {
      background: var(--ink);
      color: #fff;
      box-shadow: var(--shadow-sm);
    }

    .btn-primary {
      background: #0f172a;
      color: #fff;
    }

    .btn-primary:hover { background: #1e3a5f; }

    /* ──────────── DIAGRAM AREA ──────────── */
    .diagram-wrapper {
      flex: 1;
      overflow: auto;
      padding: 20px 24px;
      display: flex;
      align-items: flex-start;
      justify-content: flex-start;
    }

    .diagram-card {
      background: var(--surface);
      border: 2px solid var(--border-dark);
      border-radius: 12px;
      box-shadow: var(--shadow);
      overflow: auto;
      width: 100%;
      min-height: 500px;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 32px;
      position: relative;
    }

    .diagram-label {
      position: absolute;
      top: 12px;
      left: 16px;
      font-size: 10px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    #mermaid-target {
      width: 100%;
      display: flex;
      justify-content: center;
    }

    #mermaid-target svg {
      max-width: 100%;
      height: auto;
    }

    .loading-state {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      font-weight: 600;
      padding: 60px;
    }

    .spinner {
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Scrollbar */
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
  </style>
</head>

let activeIndex = 0;
let renderCounter = 0;

mermaid.initialize({
  startOnLoad: false,
  theme: 'default',
  securityLevel: 'loose',
  flowchart: { htmlLabels: true, curve: 'basis', useMaxWidth: false },
  fontSize: 14,
});

function renderNav() {
  const nav = document.getElementById('navList');
  const groups = {
    'Context & Container': [0, 1],
    'Component Level (Level 3)': [2, 3, 4, 5, 6, 7, 8],
    'Process & Deployment': [9, 10],
  };

  let html = '';
  for (const [label, indices] of Object.entries(groups)) {
    html += `<div class="nav-group-label">${label}</div>`;
    for (const i of indices) {
      const v = VIEWS[i];
      const meta = VIEW_META[v.id];
      const active = i === activeIndex ? 'active' : '';
      html += `<div class="nav-item ${active}" onclick="selectView(${i})">
        <div class="nav-num">${String(i+1).padStart(2,'0')} — ${v.cat}</div>
        <div class="nav-title">${meta.icon} ${v.title.replace(/^[0-9]+\.\s+/, '')}</div>
      </div>`;
    }
  }
  nav.innerHTML = html;
}

async function selectView(index) {
  activeIndex = index;
  renderNav();

  const v = VIEWS[index];
  const meta = VIEW_META[v.id];
  const code = MMD[v.id];

  // Update topbar
  document.getElementById('topbarIcon').textContent = meta.icon;
  document.getElementById('topbarTitle').textContent = v.title;
  document.getElementById('topbarDesc').textContent = v.desc;
  document.getElementById('diagramLabel').textContent = v.cat + ' — ' + v.id;

  const badgeRow = document.getElementById('badgeRow');
  badgeRow.innerHTML = meta.badges.map((b, i) =>
    `<span class="badge ${meta.colors[i]}">${b}</span>`
  ).join('');

  // Render diagram
  const target = document.getElementById('mermaid-target');
  target.innerHTML = '<div class="loading-state"><div class="spinner"></div>Đang render...</div>';

  await new Promise(r => setTimeout(r, 50));

  const uid = `mermaid-${index}-${++renderCounter}`;
  try {
    const { svg } = await mermaid.render(uid, code);
    target.innerHTML = svg;
    // Remove fixed dimensions from SVG for responsiveness
    const svgEl = target.querySelector('svg');
    if (svgEl) {
      svgEl.style.maxWidth = '100%';
      svgEl.style.height = 'auto';
      svgEl.removeAttribute('height');
    }
  } catch (e) {
    target.innerHTML = `<div style="padding:24px;color:#dc2626;font-family:monospace;font-size:12px;background:#fff1f2;border:1px solid #fca5a5;border-radius:8px;max-width:600px">
      <strong>❌ Mermaid Render Error</strong><br><br>${e.message}
    </div>`;
  }
}

function prevView() {
  selectView((activeIndex - 1 + VIEWS.length) % VIEWS.length);
}

function nextView() {
  selectView((activeIndex + 1) % VIEWS.length);
}

function zoomDiagram() {
  const svg = document.querySelector('#mermaid-target svg');
  if (svg) {
    svg.style.width = '100%';
    svg.style.height = 'auto';
    svg.removeAttribute('width');
    svg.removeAttribute('height');
  }
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') nextView();
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') prevView();
});

// Initialize
renderNav();
selectView(0);
</script>
